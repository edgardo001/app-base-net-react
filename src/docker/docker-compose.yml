# =============================================================================
# User Management Platform — Docker Compose
# =============================================================================
# Uso: docker compose -f src/docker/docker-compose.yml up -d
#
# NOTA: Traefik se omite porque ya hay una instancia externa funcionando.
# Las labels traefik en backend/frontend son para que el Traefik externo
# las descubra automaticamente si esta en la misma red Docker.
# =============================================================================

services:
  traefik:
    image: traefik:v3.7.1
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - traefik-net
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      # - ./dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./data/acme.json:/etc/traefik/acme/acme.json
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.rule=Host(`traefik.edgardovasquez.cl`)"
      - "traefik.http.routers.traefik.tls=true"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=auth"
      - "traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_PASS_HASH?Variable TRAEFIK_PASS_HASH no definida}"


  # --- Base de datos PostgreSQL 18 ---
  postgres:
    image: postgres:18-alpine
    container_name: mvp-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mvp-usuarios-db}
      POSTGRES_USER: ${POSTGRES_USER:-mvp-usuarios-db}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Debe definir POSTGRES_PASSWORD en .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      - mvp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mvp-usuarios-db} -d ${POSTGRES_DB:-mvp-usuarios-db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # --- Backend (.NET 10 Web API) ---
  backend:
    build:
      context: ../../
      dockerfile: src/docker/Dockerfile.backend
    container_name: mvp-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PostgreSQL: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-mvp-usuarios-db};Username=${POSTGRES_USER:-mvp-usuarios-db};Password=${POSTGRES_PASSWORD:?}"
      Jwt__SecretKey: ${Jwt__SecretKey:?Debe definir Jwt__SecretKey en .env}
      Jwt__Issuer: ${Jwt__Issuer:-mvp-usuarios}
      Jwt__Audience: ${Jwt__Audience:-mvp-usuarios-api}
      Captcha__Provider: ${Captcha__Provider:-None}
      Captcha__SiteKey: ${Captcha__SiteKey:-}
      Captcha__SecretKey: ${Captcha__SecretKey:-}
      Email__Provider: ${Email__Provider:-Smtp}
      Email__FromName: ${Email__FromName:-Sistema Gestión Usuarios}
      Email__FromEmail: ${Email__FromEmail:?Debe definir Email__FromEmail en .env}
      Email__Smtp__Host: ${Email__Smtp__Host:?Debe definir Email__Smtp__Host en .env}
      Email__Smtp__Port: ${Email__Smtp__Port:-587}
      Email__Smtp__Username: ${Email__Smtp__Username:?Debe definir Email__Smtp__Username en .env}
      Email__Smtp__Password: ${Email__Smtp__Password:?Debe definir Email__Smtp__Password en .env}
      Authentication__Google__ClientId: ${Authentication__Google__ClientId:?Debe definir Authentication__Google__ClientId en .env}
      Authentication__Google__ClientSecret: ${Authentication__Google__ClientSecret:?Debe definir Authentication__Google__ClientSecret en .env}
      Authentication__Google__RedirectUri: ${Authentication__Google__RedirectUri:?Debe definir Authentication__Google__RedirectUri en .env}
      Authentication__GitHub__ClientId: ${Authentication__GitHub__ClientId:?Debe definir Authentication__GitHub__ClientId en .env}
      Authentication__GitHub__ClientSecret: ${Authentication__GitHub__ClientSecret:?Debe definir Authentication__GitHub__ClientSecret en .env}
      Authentication__GitHub__RedirectUri: ${Authentication__GitHub__RedirectUri:?Debe definir Authentication__GitHub__RedirectUri en .env}
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:?Debe definir FRONTEND_DOMAIN en .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mvp-network
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.backend.rule=Host(`${BACKEND_DOMAIN:-mvp-usuarios-back.example.com}`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/ || [ $? -eq 8 ]"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 300M

  # --- Frontend (React + Vite + Nginx) ---
  frontend:
    build:
      context: ../../
      dockerfile: src/docker/Dockerfile.frontend
    container_name: mvp-frontend
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mvp-network
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.frontend.rule=Host(`${FRONTEND_DOMAIN:-mvp-usuarios-front.example.com}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 100M

volumes:
  postgres-data:
  # traefik-letsencrypt:  # ya no se necesita al usar Traefik externo

networks:
  mvp-network:
    driver: bridge
  traefik-net:
    name: traefik-net
    driver: bridge
