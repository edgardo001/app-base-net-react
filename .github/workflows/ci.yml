name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore app-base-net-react.slnx

      - name: Build
        run: dotnet build app-base-net-react.slnx --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test app-base-net-react.slnx --no-build --configuration Release --filter "FullyQualifiedName!~Integration" --verbosity normal

      - name: Run integration tests
        run: dotnet test app-base-net-react.slnx --no-build --configuration Release --filter "FullyQualifiedName~Integration" --verbosity normal
        env:
          ConnectionStrings__PostgreSQL: "Host=localhost;Database=test_db;Username=test_user;Password=test_password"

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: src/frontend

      - name: Lint
        run: npm run lint --if-present
        working-directory: src/frontend

      - name: Build
        run: npm run build
        working-directory: src/frontend

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/docker/Dockerfile.backend
          push: false
          tags: app-base-net-react-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: src/frontend
          file: src/docker/Dockerfile.frontend
          push: false
          tags: app-base-net-react-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
